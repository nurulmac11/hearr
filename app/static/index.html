<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hearr</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="locked">
  <aside class="nav">
    <a class="brand" href="#/charts">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>Hearr</span>
    </a>
    <nav>
      <a href="#/charts" data-nav="charts"><span class="i">📈</span><span>Charts</span></a>
      <a href="#/genres" data-nav="genres"><span class="i">🎛️</span><span>Genres</span></a>
      <a href="#/new" data-nav="new"><span class="i">✨</span><span>New</span></a>
      <a href="#/discover" data-nav="discover"><span class="i">🧭</span><span>Discover</span></a>
      <a href="#/requests" data-nav="requests"><span class="i">📥</span><span>Requests</span></a>
    </nav>
    <div class="nav-foot" id="lidarr-status"></div>
  </aside>

  <main>
    <header class="top">
      <form id="search-form" autocomplete="off">
        <input id="search" type="search" placeholder="Search artists, albums, songs…" aria-label="Search">
      </form>
    </header>
    <div id="view" class="view"></div>
  </main>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="modal-close" aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="login" class="login" hidden>
    <div class="login-card">
      <img src="/static/icon.svg" alt="" width="64" height="64">
      <h1>Hearr</h1>
      <p class="sub">Discover music and send it to your library.<br>Sign in with your media server account.</p>
      <button id="login-btn" class="btn plex" hidden>Sign in with Plex</button>
      <p id="login-or" class="login-or" hidden>or</p>
      <form id="pw-form" class="pw-form" hidden>
        <input id="pw-user" name="username" autocomplete="username" placeholder="Username" aria-label="Username" required>
        <input id="pw-pass" name="password" type="password" autocomplete="current-password" placeholder="Password" aria-label="Password">
        <button id="pw-btn" class="btn jellyfin" type="submit">Sign in</button>
      </form>
      <p id="login-msg" class="login-msg"></p>
    </div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="player" class="player" hidden></div>

  <script src="/static/app.js"></script>
</body>
</html>
